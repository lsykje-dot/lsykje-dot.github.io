name: Build 나의일기장 APK

on:
  push:
    branches:
      - claude/mobile-diary-app-plan-iqzgkn
    paths:
      - "diary-app/**"
      - ".github/workflows/build-diary-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diary-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest 러너에는 안드로이드 SDK가 이미 깔려 있음. 필요한 플랫폼/빌드툴만
      # 직접 설치(android-actions/setup-android는 더 이상 없는 "tools" 패키지를 설치하려다
      # 실패하는 문제가 있어 사용하지 않음)
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 나의일기장-debug-apk
          path: diary-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
