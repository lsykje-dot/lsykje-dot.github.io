name: Build 나의일기장 APK

on:
  push:
    branches:
      - claude/mobile-diary-app-plan-iqzgkn
    paths:
      - "diary-app/**"
      - ".github/workflows/build-diary-app.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: diary-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 나의일기장-debug-apk
          path: diary-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
