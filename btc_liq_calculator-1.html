<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BTC 레버리지 청산가 계산기</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

:root{
  --bg:#0B0E14;
  --surface:#12161F;
  --surface2:#171C27;
  --border:#232938;
  --border-soft:#1B2130;
  --text:#E8EAED;
  --text-dim:#8B93A7;
  --text-faint:#5B6376;
  --long:#26C6A6;
  --long-dim:#153832;
  --short:#F0555A;
  --short-dim:#3A1B1C;
  --gold:#F0B90B;
  --gold-dim:#3A2F08;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Space Grotesk',-apple-system,sans-serif;
  padding:20px 14px 48px;
  line-height:1.5;
}
.wrap{max-width:480px;margin:0 auto;}
.mono{font-family:'JetBrains Mono',monospace;}

header{margin-bottom:18px;}
header .eyebrow{color:var(--gold);font-size:11.5px;font-weight:600;letter-spacing:0.02em;margin-bottom:5px;}
header h1{font-size:21px;font-weight:700;margin:0 0 6px;}
header p{color:var(--text-dim);font-size:12.5px;margin:0;line-height:1.55;}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:12px;
}
.panel-title{font-size:12.5px;font-weight:600;color:var(--text-dim);margin:0 0 12px;}

.row{display:flex;flex-wrap:wrap;gap:10px;}
.field{flex:1 1 100%;min-width:0;}
.field label{display:block;font-size:11.5px;color:var(--text-dim);margin-bottom:6px;}
.field input, .field select{
  width:100%;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:12px 12px;
  font-size:16px; /* 16px+ prevents iOS auto-zoom on focus */
  font-family:'JetBrains Mono',monospace;
}
.field select{font-family:'Space Grotesk',sans-serif;}
.field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
.field input::placeholder{color:var(--text-faint);font-size:14px;}

/* 기본설정의 방향/유지증거금율만 2열로 나란히 */
.row.settings-row .field{flex:1 1 0;}

.dir-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dir-toggle button{
  flex:1;padding:12px 0;background:var(--surface2);color:var(--text-dim);
  border:none;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;
}
.dir-toggle button.active.long{background:var(--long-dim);color:var(--long);}
.dir-toggle button.active.short{background:var(--short-dim);color:var(--short);}

.type-toggle{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:12px;}
.type-toggle button{
  flex:1;padding:11px 4px;background:var(--surface2);color:var(--text-dim);
  border:none;font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;
}
.type-toggle button.active{background:var(--gold-dim);color:var(--gold);}

.btn-add{
  margin-top:12px;width:100%;padding:14px 0;background:var(--gold);color:#1a1400;
  border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;
}
.btn-add:active{filter:brightness(0.95);}
.btn-reset{
  background:none;border:1px solid var(--border);color:var(--text-faint);
  border-radius:8px;padding:8px 12px;font-size:11.5px;font-family:'Space Grotesk',sans-serif;
}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;}
.stat{background:var(--surface);padding:13px 14px;}
.stat .k{font-size:10.5px;color:var(--text-dim);margin-bottom:5px;}
.stat .v{font-size:17px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.stat.liq{background:var(--gold-dim);grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:14px;}
.stat.liq .k{color:var(--gold);font-size:11.5px;margin-bottom:0;}
.stat.liq .v{color:var(--gold);font-size:20px;}

/* 거래 이력: 표 대신 카드 리스트 (모바일 최적화) */
.history-list{display:flex;flex-direction:column;gap:10px;}
.h-card{
  background:var(--surface2);border:1px solid var(--border);
  border-left:3px solid var(--text-faint);border-radius:8px;padding:12px 13px;
}
.h-card.entry-long{border-left-color:var(--long);}
.h-card.entry-short{border-left-color:var(--short);}
.h-card.margin-add{border-left-color:var(--gold);}

.h-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.h-top-left{display:flex;align-items:center;gap:7px;}
.h-num{font-size:11.5px;color:var(--text-faint);font-family:'JetBrains Mono',monospace;}
.tag{display:inline-block;font-size:10px;padding:3px 7px;border-radius:4px;font-weight:600;}
.tag.entry-long{background:var(--long-dim);color:var(--long);}
.tag.entry-short{background:var(--short-dim);color:var(--short);}
.tag.margin{background:var(--gold-dim);color:var(--gold);}
.del-btn{background:none;border:none;color:var(--text-faint);font-size:15px;padding:4px 6px;line-height:1;}
.del-btn:active{color:var(--short);}

.h-desc{font-size:13px;color:var(--text);margin-bottom:10px;font-family:'JetBrains Mono',monospace;}

.h-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px 12px;padding-top:9px;border-top:1px dashed var(--border-soft);}
.h-item .k{font-size:10px;color:var(--text-faint);margin-bottom:3px;}
.h-item .v{font-size:13px;font-family:'JetBrains Mono',monospace;font-weight:600;}

.h-liq{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:9px 11px;background:var(--gold-dim);border-radius:6px;}
.h-liq .k{font-size:10.5px;color:var(--gold);font-weight:600;}
.h-liq .v{font-size:15px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--gold);}

.empty-hist{text-align:center;color:var(--text-faint);padding:30px 10px;font-size:12.5px;}

.note{font-size:11px;color:var(--text-faint);margin-top:12px;line-height:1.6;}
@keyframes flash{0%{background:rgba(240,185,11,0.18);}100%{background:transparent;}}
.flash{animation:flash 0.6s ease-out;}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="eyebrow">BTC/USDT · 무기한선물</div>
  <h1>레버리지 청산가 계산기</h1>
  <p>진입을 나눠서 할 때마다 평균진입가와 청산가가 어떻게 바뀌는지, 증거금을 추가하면 청산가가 얼마나 멀어지는지 단계별로 확인합니다.</p>
</header>

<div class="panel">
  <div class="panel-title">기본 설정</div>
  <div class="row settings-row">
    <div class="field">
      <label>포지션 방향</label>
      <div class="dir-toggle">
        <button id="btnLong" class="active long" onclick="setDirection('long')">롱 (상승)</button>
        <button id="btnShort" class="short" onclick="setDirection('short')">숏 (하락)</button>
      </div>
    </div>
    <div class="field">
      <label>유지증거금율 (%)</label>
      <input type="number" id="mmr" value="0.5" step="0.05" min="0" onchange="render()">
    </div>
  </div>
</div>

<div class="panel">
  <div class="panel-title">거래 추가</div>
  <div class="type-toggle">
    <button id="typeEntry" class="active" onclick="setStepType('entry')">포지션 진입 / 추가매수</button>
    <button id="typeMargin" onclick="setStepType('margin')">증거금만 추가</button>
  </div>

  <div id="entryFields" class="row">
    <div class="field">
      <label>진입가격 (USDT)</label>
      <input type="number" id="inPrice" inputmode="decimal" placeholder="예: 65000">
    </div>
    <div class="field">
      <label>레버리지 (x)</label>
      <input type="number" id="inLeverage" inputmode="decimal" placeholder="예: 10" value="10">
    </div>
    <div class="field">
      <label>투자 증거금 (USDT)</label>
      <input type="number" id="inMargin" inputmode="decimal" placeholder="예: 1000">
    </div>
  </div>

  <div id="marginFields" class="row" style="display:none;">
    <div class="field">
      <label>추가 증거금 (USDT)</label>
      <input type="number" id="inExtraMargin" inputmode="decimal" placeholder="예: 500">
    </div>
  </div>

  <button class="btn-add" onclick="addStep()">추가하기</button>
</div>

<div class="stats-grid" id="statsGrid"></div>

<div class="panel">
  <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:nowrap;">
    <div class="panel-title" style="margin:0;">거래 이력</div>
    <button class="btn-reset" onclick="resetAll()">전체 초기화</button>
  </div>
  <div id="historyList" class="history-list"></div>
  <p class="note">
    ※ 유지증거금율은 실제 바이낸스에서는 포지션 규모 구간(브라켓)에 따라 달라지고, 펀딩비·브라켓 변경분은 반영되지 않은 단순화된 계산입니다. 실거래 청산가는 거래소 화면의 값을 최종 기준으로 확인하세요.
  </p>
</div>

</div>

<script>
let direction = 'long';
let stepType = 'entry';
let steps = []; // {type:'entry', price, leverage, margin} | {type:'margin', amount}

function setDirection(d){
  direction = d;
  document.getElementById('btnLong').classList.toggle('active', d==='long');
  document.getElementById('btnShort').classList.toggle('active', d==='short');
  render();
}

function setStepType(t){
  stepType = t;
  document.getElementById('typeEntry').classList.toggle('active', t==='entry');
  document.getElementById('typeMargin').classList.toggle('active', t==='margin');
  document.getElementById('entryFields').style.display = t==='entry' ? 'flex' : 'none';
  document.getElementById('marginFields').style.display = t==='margin' ? 'flex' : 'none';
}

function addStep(){
  if(stepType==='entry'){
    const price = parseFloat(document.getElementById('inPrice').value);
    const leverage = parseFloat(document.getElementById('inLeverage').value);
    const margin = parseFloat(document.getElementById('inMargin').value);
    if(!(price>0) || !(leverage>=1) || !(margin>0)){
      alert('진입가격, 레버리지(1 이상), 증거금을 정확히 입력해주세요.');
      return;
    }
    steps.push({type:'entry', price, leverage, margin});
    document.getElementById('inPrice').value='';
    document.getElementById('inMargin').value='';
  } else {
    const amount = parseFloat(document.getElementById('inExtraMargin').value);
    if(!(amount>0)){
      alert('추가할 증거금 금액을 정확히 입력해주세요.');
      return;
    }
    if(steps.length===0){
      alert('먼저 포지션을 1건 이상 진입해야 증거금을 추가할 수 있어요.');
      return;
    }
    steps.push({type:'margin', amount});
    document.getElementById('inExtraMargin').value='';
  }
  render(true);
}

function removeStep(idx){
  steps.splice(idx,1);
  render();
}

function resetAll(){
  if(steps.length && !confirm('모든 거래 이력을 초기화할까요?')) return;
  steps = [];
  render();
}

function fmt(n, digits){
  if(n===null || n===undefined || isNaN(n)) return '-';
  return n.toLocaleString('en-US', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

function calc(){
  const mmr = (parseFloat(document.getElementById('mmr').value)||0)/100;
  let totalQty=0, totalMargin=0, totalNotional=0;
  const rows = [];
  steps.forEach((s, i)=>{
    if(s.type==='entry'){
      const notional = s.margin * s.leverage;
      const qty = notional / s.price;
      totalQty += qty;
      totalMargin += s.margin;
      totalNotional += notional; // = price*qty
    } else {
      totalMargin += s.amount;
    }
    const avgPrice = totalQty>0 ? totalNotional/totalQty : 0;
    const notionalNow = totalQty*avgPrice;
    const effLev = totalMargin>0 ? notionalNow/totalMargin : 0;
    let liq = null;
    if(totalQty>0 && effLev>0){
      liq = direction==='long'
        ? avgPrice*(1 - 1/effLev)/(1-mmr)
        : avgPrice*(1 + 1/effLev)/(1+mmr);
    }
    rows.push({step:s, idx:i, totalQty, totalMargin, avgPrice, effLev, liq});
  });
  return {mmr, rows};
}

function render(justAdded){
  const {rows} = calc();
  const list = document.getElementById('historyList');
  list.innerHTML='';

  if(rows.length===0){
    list.innerHTML = '<div class="empty-hist">아직 추가된 거래가 없습니다.<br>위에서 첫 진입을 추가해보세요.</div>';
  } else {
    rows.forEach((r, i)=>{
      const card = document.createElement('div');
      let typeClass, tagHtml, descHtml;
      if(r.step.type==='entry'){
        typeClass = `entry-${direction}`;
        tagHtml = `<span class="tag entry-${direction}">진입</span>`;
        descHtml = `${fmt(r.step.price,0)} USDT · ${r.step.leverage}x · ${fmt(r.step.margin,0)} USDT 투입`;
      } else {
        typeClass = 'margin-add';
        tagHtml = `<span class="tag margin">증거금+</span>`;
        descHtml = `+${fmt(r.step.amount,0)} USDT 증거금 추가`;
      }
      card.className = `h-card ${typeClass}` + (justAdded && i===rows.length-1 ? ' flash' : '');
      card.innerHTML = `
        <div class="h-top">
          <div class="h-top-left">
            <span class="h-num">#${i+1}</span>
            ${tagHtml}
          </div>
          <button class="del-btn" onclick="removeStep(${i})">✕</button>
        </div>
        <div class="h-desc">${descHtml}</div>
        <div class="h-grid">
          <div class="h-item"><div class="k">누적 총투자금</div><div class="v">${fmt(r.totalMargin,0)}</div></div>
          <div class="h-item"><div class="k">총수량(BTC)</div><div class="v">${fmt(r.totalQty,6)}</div></div>
          <div class="h-item"><div class="k">평균진입가</div><div class="v">${fmt(r.avgPrice,1)}</div></div>
          <div class="h-item"><div class="k">유효레버리지</div><div class="v">${fmt(r.effLev,2)}x</div></div>
        </div>
        <div class="h-liq"><span class="k">청산가</span><span class="v">${fmt(r.liq,1)}</span></div>
      `;
      list.appendChild(card);
    });
  }

  const last = rows.length ? rows[rows.length-1] : null;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat"><div class="k">총 투자 증거금</div><div class="v">${last?fmt(last.totalMargin,0):'-'}</div></div>
    <div class="stat"><div class="k">총 수량 (BTC)</div><div class="v">${last?fmt(last.totalQty,6):'-'}</div></div>
    <div class="stat"><div class="k">평균 진입가</div><div class="v">${last?fmt(last.avgPrice,1):'-'}</div></div>
    <div class="stat"><div class="k">유효 레버리지</div><div class="v">${last?fmt(last.effLev,2)+'x':'-'}</div></div>
    <div class="stat liq"><div class="k">청산가 (${direction==='long'?'롱':'숏'})</div><div class="v">${last?fmt(last.liq,1):'-'}</div></div>
  `;
}

render();
</script>
</body>
</html>
