<!DOCTYPE html>
<html lang="ko">

<title>오늘의 마음훈련 - 미래가 현재를 바꾸는 문구</title>
<style>

    --bg-top:#0b1030;
    --bg-bottom:#1b2454;
    --card-bg:rgba(255,255,255,0.06);
    --card-border:rgba(255,255,255,0.14);

    --text-sub:#b9bfe0;

  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at top, var(--bg-bottom), var(--bg-top) 70%);
    color:var(--text-main);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;

    justify-content:center;
    padding:24px 12px 60px;
    position:relative;
    overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #stars span{
    position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;
    opacity:.5;animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{opacity:.15;}50%{opacity:.9;}}

  .app{position:relative;z-index:1;width:100%;max-width:480px;}

  header{text-align:center;margin-bottom:14px;}
  header h1{font-size:1.3rem;margin:0 0 4px;font-weight:700;letter-spacing:-0.02em;}
  header .date{color:var(--text-sub);font-size:.85rem;}
  .streak{
    display:inline-flex;align-items:center;gap:6px;margin-top:10px;
    background:rgba(255,215,106,0.12);border:1px solid rgba(255,215,106,0.35);
    color:var(--accent);padding:5px 14px;border-radius:999px;font-size:.82rem;font-weight:600;
  }

  .tabs{display:flex;gap:8px;margin:18px 0 14px;}
  .tabs button{
    flex:1;padding:10px 0;border-radius:12px;border:1px solid var(--card-border);
    background:var(--card-bg);color:var(--text-sub);font-size:.9rem;font-weight:600;
    cursor:pointer;transition:.15s;
  }
  .tabs button.active{background:var(--accent);color:#22262f;border-color:var(--accent);}

  .card{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;
    padding:22px 20px;backdrop-filter:blur(6px);margin-bottom:16px;
  }

  .badge{
    display:inline-block;padding:4px 12px;border-radius:999px;font-size:.75rem;font-weight:700;
    color:#fff;margin-bottom:14px;
  }
  .badge-sub{display:block;font-size:.7rem;font-weight:500;opacity:.85;margin-top:2px;}

  .quote-text{
    font-size:1.28rem;line-height:1.55;font-weight:600;margin:6px 0 16px;position:relative;padding:0 6px;
  }
  .quote-text::before{content:"“";font-size:1.4em;color:var(--accent);margin-right:2px;vertical-align:-0.15em;}
  .quote-text::after{content:"”";font-size:1.4em;color:var(--accent);margin-left:2px;vertical-align:-0.5em;}

  .concept-line{color:var(--text-sub);font-size:.82rem;margin-bottom:2px;}
  .concept-line b{color:var(--text-main);}

  .card-top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .star-btn{background:none;border:none;color:var(--text-sub);font-size:1.3rem;cursor:pointer;line-height:1;padding:2px 4px;}
  .star-btn.active{color:var(--accent);}

  .section-title{font-size:.95rem;font-weight:700;margin:22px 0 10px 2px;color:var(--text-main);}
  .checklist{display:flex;flex-direction:column;gap:8px;}
  .check-item{
    display:flex;align-items:flex-start;gap:10px;background:var(--card-bg);
    border:1px solid var(--card-border);border-radius:12px;padding:10px 12px;cursor:pointer;
  }
  .check-item input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none;}
  .check-item .lbl{font-size:.86rem;line-height:1.4;}
  .check-item .lbl small{display:block;color:var(--text-sub);font-size:.74rem;margin-top:1px;}
  .check-item.done .lbl{color:var(--text-sub);text-decoration:line-through;}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
  .filters button{
    padding:6px 12px;border-radius:999px;border:1px solid var(--card-border);background:var(--card-bg);
    color:var(--text-sub);font-size:.76rem;cursor:pointer;
  }
  .filters button.active{background:#fff;color:#111;border-color:#fff;}

  .list-item{
    border:1px solid var(--card-border);border-left-width:4px;border-radius:10px;
    padding:10px 12px;margin-bottom:8px;background:var(--card-bg);display:flex;justify-content:space-between;gap:10px;

  .list-item.today{outline:2px solid var(--accent);}
  .list-item .txt{font-size:.86rem;line-height:1.45;}
  .list-item .cat{font-size:.68rem;color:var(--text-sub);margin-top:3px;}

  footer{margin-top:28px;text-align:center;color:var(--text-sub);font-size:.78rem;line-height:1.7;}
  footer .quote-final{color:var(--text-main);font-weight:600;font-size:.86rem;margin-bottom:10px;}
  footer a{color:var(--accent);text-decoration:none;}

  [hidden]{display:none!important;}
</style>
</head>

/* 카테고리를 하루씩 돌아가며 섞은 전체 문구 배열 생성(라운드로빈) */
const QUOTES = (function(){
  const pools = CATEGORIES.map(c => QUOTES_BY_CAT[c.key].map((t,i)=>({cat:c.key, text:t})));
  const max = Math.max(...pools.map(p=>p.length));
  const out = [];
  for(let i=0;i<max;i++){
    pools.forEach(p => { if(p[i]) out.push(p[i]); });
  }
  return out.map((q,idx)=>({ id: idx, cat:q.cat, text:q.text }));
})();

/* ---------- 날짜/저장소 유틸 ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dayNumber(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000); }

const today = new Date();
const todayKey = dateKey(today);
const todayIndex = ((dayNumber(today) % QUOTES.length) + QUOTES.length) % QUOTES.length;
const todayQuote = QUOTES[todayIndex];

function loadJSON(key, fallback){
  try{ const v = JSON.parse(localStorage.getItem(key)); return v ?? fallback; }catch(e){ return fallback; }
}
function saveJSON(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let favorites = loadJSON('mindtraining_favorites', []);
let progress = loadJSON('mindtraining_progress', {});
if(!progress[todayKey]) progress[todayKey] = PRACTICE_STEPS.map(()=>false);

function toggleFavorite(id){
  const i = favorites.indexOf(id);
  if(i>=0) favorites.splice(i,1); else favorites.push(id);
  saveJSON('mindtraining_favorites', favorites);
}

function calcStreak(){
  let streak = 0;
  const d = new Date(today);
  const allDone = (arr)=> arr && arr.length===PRACTICE_STEPS.length && arr.every(Boolean);
  if(allDone(progress[dateKey(d)])){ streak = 1; }
  d.setDate(d.getDate()-1);
  while(true){
    const k = dateKey(d);
    if(allDone(progress[k])){ streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

/* ---------- 렌더링: 오늘의 문구 ---------- */
function catOf(key){ return CATEGORIES.find(c=>c.key===key); }

function renderToday(){
  const cat = catOf(todayQuote.cat);
  document.getElementById('todayDate').textContent =
    today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일';
  document.getElementById('streakBadge').textContent = '🔥 연속 ' + calcStreak() + '일째 실천 중';

  const badge = document.getElementById('todayBadge');
  badge.style.background = cat.color;
  badge.innerHTML = cat.name + '<span class="badge-sub">' + cat.sub + '</span>';

  document.getElementById('todayQuoteText').textContent = todayQuote.text;
  document.getElementById('todayConcept').textContent = cat.concept;
  document.getElementById('todayValue').textContent = cat.value;

  const star = document.getElementById('todayStar');
  const isFav = favorites.includes(todayQuote.id);
  star.textContent = isFav ? '★' : '☆';
  star.classList.toggle('active', isFav);
  star.onclick = () => { toggleFavorite(todayQuote.id); renderToday(); };

  renderChecklist();
}

function renderChecklist(){
  const box = document.getElementById('checklist');
  box.innerHTML = '';
  const state = progress[todayKey];
  PRACTICE_STEPS.forEach((step, i)=>{
    const row = document.createElement('label');
    row.className = 'check-item' + (state[i] ? ' done' : '');
    row.innerHTML =
      '<input type="checkbox" ' + (state[i] ? 'checked' : '') + '>' +
      '<span class="lbl">' + (i+1) + '. ' + step.t + (step.s ? '<small>'+step.s+'</small>' : '') + '</span>';
    row.querySelector('input').addEventListener('change', (e)=>{
      state[i] = e.target.checked;
      saveJSON('mindtraining_progress', progress);
      renderToday();
    });
    box.appendChild(row);
  });
}

/* ---------- 렌더링: 전체 보기 ---------- */
let activeFilter = 'all';

function renderFilters(){
  const box = document.getElementById('filters');
  const opts = [{key:'all', name:'전체'}, ...CATEGORIES, {key:'fav', name:'★ 즐겨찾기'}];
  box.innerHTML = '';
  opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.textContent = o.name;
    btn.className = activeFilter === o.key ? 'active' : '';
    btn.onclick = ()=>{ activeFilter = o.key; renderArchive(); };
    box.appendChild(btn);
  });
}

function renderArchive(){
  renderFilters();
  const list = document.getElementById('archiveList');
  list.innerHTML = '';
  let items = QUOTES;
  if(activeFilter === 'fav') items = QUOTES.filter(q=>favorites.includes(q.id));
  else if(activeFilter !== 'all') items = QUOTES.filter(q=>q.cat===activeFilter);

  if(items.length === 0){
    list.innerHTML = '<div class="concept-line" style="text-align:center;padding:20px 0;">표시할 문구가 없습니다.</div>';
    return;
  }

  items.forEach(q=>{
    const cat = catOf(q.cat);
    const row = document.createElement('div');
    row.className = 'list-item' + (q.id === todayQuote.id ? ' today' : '');
    row.style.borderLeftColor = cat.color;
    const isFav = favorites.includes(q.id);
    row.innerHTML =
      '<div class="txt">' + q.text + '<div class="cat">' + cat.name + (q.id===todayQuote.id ? ' · 오늘의 문구' : '') + '</div></div>' +
      '<button class="star-btn ' + (isFav?'active':'') + '" style="font-size:1.1rem;">' + (isFav?'★':'☆') + '</button>';
    row.querySelector('button').onclick = ()=>{ toggleFavorite(q.id); renderArchive(); };
    list.appendChild(row);
  });
}

/* ---------- 탭 전환 ---------- */
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.getElementById('view-today').hidden = view !== 'today';
    document.getElementById('view-archive').hidden = view !== 'archive';
    if(view === 'archive') renderArchive();
  });
});

renderToday();
</script>
</body>
